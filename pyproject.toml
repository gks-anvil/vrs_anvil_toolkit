[project]
name = "vrs_anvil"
authors = [
    {"name" = "GKM-AnVIL"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
description = "Useful tools and methods for applying GA4GH GKS and VRS models on the NHGRI AnVIL platform."
license-files = ["LICENSE"]
dependencies = [
    "click",
    "pydantic-settings",
    "ga4gh.vrs[extras]>=2.1.3,<3.0",
    "ga4gh.va_spec>=0.2.0",
    "biocommons.seqrepo",
]
dynamic = ["version"]

[dependency-groups]
tests = [
    "pytest",
    "pytest-cov",
]
dev = [
    "prek>=0.4.5",
    "ruff==0.17.4",
]

[project.urls]
Homepage = "https://github.com/gks-anvil/vrs_anvil_toolkit"
Documentation = "https://github.com/gks-anvil/vrs_anvil_toolkit"
Changelog = "https://github.com/gks-anvil/vrs_anvil_toolkit/releases"
Source = "https://github.com/gks-anvil/vrs_anvil_toolkit"
"Bug Tracker" = "https://github.com/gks-anvil/vrs_anvil_toolkit/issues"

[project.scripts]
vrs_anvil = "vrs_anvil.cli:cli"

[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# [tool.setuptools.package-data]
# vrs_anvil = ["**/*.yaml"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # unused
    "AIR",
    "ERA",
    "YTT",
    "BLE",
    "FBT",
    "CPY",
    "DJ",
    "EXE",
    "FIX",
    "FA",
    "PYI",
    "TD",
    "C90",
    "NPY",
    "PD",
    # ignore for compatibility with formatter
    "D206",
    "D300",
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "W191",
    "S321",
    "COM812",
    "COM819",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    # don't require types on *args, **kwargs
    "ANN002",
    "ANN003",
    # subjective pylint thresholds
    "PLR0904",
    "PLR091",
    "PLR1702",
    "PLC0206",
    # misc unnecessary stuff
    "S321",
    "D203",
    "D205",
    "D213",
    "D400",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# D100 - undocumented-public-module
# D102 - undocumented-public-class
# D103 - undocumented-public-function
# S101 - assert
# B011 - assert-false
# INP001 - implicit-namespace-package
# PLR2004 - magic-value-comparison
"tests/*" = [
    "ANN001",
    "ANN2",
    "D",
    "S101",
    "B011",
    "INP001",
    "PLR2004",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
